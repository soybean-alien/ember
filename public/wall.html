<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember: wall</title>
<style>
  /* Ember by soybean_alien. Read-only wall for a second screen: sized in vw so it fills any TV. */
  :root { color-scheme: dark; --bg:#050c1c; --panel:#0c1a36; --line:#1e3260; --ink:#eef3ff; --mute:#8d9dc2; --accent:#ff7a1a; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:1vw/1.35 "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; overflow:hidden; cursor:default; }
  header { display:flex; align-items:flex-end; gap:2.6vw; padding:1.2vw 1.6vw .9vw; border-bottom:1px solid var(--line); }
  h1 { margin:0; font:700 2.2vw/1 "Segoe UI", system-ui, sans-serif; display:flex; align-items:center; gap:.7vw; }
  .ember { display:inline-block; width:.7vw; height:.7vw; border-radius:50%; flex:none;
    background:color-mix(in srgb, #ff7a1a calc(var(--h) * 100%), #1e3260); box-shadow:0 0 calc(var(--h) * 1vw) rgba(255,122,26,var(--h)); }
  h1 .ember { width:1.3vw; height:1.3vw; animation:glow 3.2s ease-in-out infinite; }
  .stat b { display:block; font:600 2.2vw/1 "Cascadia Mono", Consolas, monospace; }
  .stat small { color:var(--mute); text-transform:uppercase; letter-spacing:.1em; font-size:.72vw; }
  .stat.hot b { color:var(--accent); }
  .clock { margin-left:auto; text-align:right; font:600 2.2vw/1 "Cascadia Mono", Consolas, monospace; }
  .clock small { display:block; color:var(--mute); font:400 .85vw/1.6 "Segoe UI", sans-serif; }

  main { flex:1; display:grid; grid-template-columns:minmax(0, 1fr) 21vw; gap:1vw; padding:1vw 1.6vw 1.3vw; min-height:0; }
  .floor { display:grid; grid-template-rows:1.25fr 1fr; gap:1vw; min-height:0; }
  .rowg { display:grid; gap:.8vw; min-height:0; }
  .rowg.deals { grid-template-columns:repeat(5, minmax(0, 1fr)); }
  .rowg.rest { grid-template-columns:repeat(5, minmax(0, 1fr)); }
  section { display:flex; flex-direction:column; min-height:0; border-radius:.6vw; border:1px solid color-mix(in srgb, var(--c) 35%, var(--line));
    background:linear-gradient(180deg, color-mix(in srgb, var(--c) 13%, transparent), transparent 55%); overflow:hidden; }
  section.idle { opacity:.5; }
  h2 { margin:0; padding:.55vw .7vw; font-size:.85vw; letter-spacing:.04em; display:flex; justify-content:space-between; align-items:baseline; gap:.5vw;
    color:#071023; background:var(--c); font-weight:700; }
  h2 b { font:700 1.3vw/1 "Cascadia Mono", Consolas, monospace; }
  .cards { overflow:hidden; flex:1; padding:.6vw; }
  .card { background:var(--panel); border:1px solid var(--line); border-left:.3vw solid var(--c); border-radius:.45vw; padding:.5vw .6vw; margin-bottom:.5vw; }
  .nm { font-weight:600; font-size:1vw; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .price { color:var(--c); font:600 1vw/1.3 "Cascadia Mono", Consolas, monospace; }
  .meta, .who { color:var(--mute); font-size:.8vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who { color:var(--ink); margin-top:.15vw; }
  .more, .none { color:var(--mute); font-size:.8vw; text-align:center; padding:.4vw; }

  .rail { border:1px solid var(--line); border-radius:.6vw; background:var(--panel); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .rail h2 { background:var(--accent); }
  .rail .cards { padding:.7vw; }
  .todo { border-left:.3vw solid var(--c); padding:.35vw .6vw; margin-bottom:.6vw; animation:pulse 2.6s ease-in-out infinite; }
  .todo b { display:block; font-size:.95vw; line-height:1.25; }
  .todo small { color:var(--mute); font-size:.8vw; }
  .clear { color:var(--mute); text-align:center; padding:2vw .5vw; font-size:.95vw; }
  @keyframes pulse { 50% { opacity:.6; } }
  @keyframes glow { 50% { box-shadow:0 0 1.6vw rgba(255,122,26,.9); } }
  @media (prefers-reduced-motion: reduce) { .todo, h1 .ember { animation:none; } }
</style>
</head>
<body>
<header>
  <h1><span class="ember" style="--h:1"></span>Ember</h1>
  <div id="stats" style="display:flex;gap:2.6vw"></div>
  <div class="clock"><span id="time"></span><small id="date"></small></div>
</header>
<main>
  <div class="floor"><div class="rowg deals" id="deals"></div><div class="rowg rest" id="rest"></div></div>
  <div class="rail"><h2><span>Your move</span><b id="todon">0</b></h2><div class="cards" id="todo"></div></div>
</main>
<script src="/shared.js"></script>
<script>
// Read-only wall view. Refreshes itself; shows buyer first names but never emails or handles.
const first = (n) => esc(String(n || "Buyer").trim().split(" ")[0]);

function card(i, c) {
  const lead = leadOf(i);
  const sold = i.stage === "sold";
  const platforms = [...new Set(i.postings.map((p) => p.platform).filter(Boolean))].join(", ");
  return `<div class="card" style="--c:${c}">
    <div class="nm">${esc(i.name || "Unnamed item")}</div>
    <div class="price">${sold ? money(i.sold_price, 0, i.currency) : money(i.asking, 0, i.currency)}</div>
    ${lead && !sold ? `<div class="who">${ember(lead.updated)} ${first(lead.name)}${lead.pickup_at ? `, ${esc(whenOf(lead.pickup_at))}` : lead.meet ? `, ${esc(lead.meet)}` : ""} · ${esc(ago(lead.updated))}</div>`
      : `<div class="meta">${[platforms, i.days_listed === null ? "" : sold ? `sold in ${days(i.days_listed)}` : `${days(i.days_listed)} listed`].filter(Boolean).map(esc).join(" · ")}</div>`}
  </div>`;
}
function block(items, key, cap) {
  const st = STAGE[key];
  const all = items.filter((i) => i.stage === key);
  const shown = all.slice(0, cap);
  return `<section class="${all.length ? "" : "idle"}" style="--c:${st.c}"><h2><span>${st.label}</span><b>${all.length}</b></h2><div class="cards">${
    shown.map((i) => card(i, st.c)).join("") || `<div class="none">None</div>`}${all.length > shown.length ? `<div class="more">and ${all.length - shown.length} more</div>` : ""}</div></section>`;
}

async function draw() {
  try {
    const { items, stats: s, reminders, settings } = await fetch("/api/board").then((r) => r.json());
    useSettings(settings);
    document.getElementById("stats").innerHTML = [
      [reminders.length, "waiting on you", "hot"], [s.listed, "listed"], [totals(s.listed_value, 0), "asking"], [s.in_talks, "in talks"], [s.sold, "sold"], [totals(s.sold_value, 0), "taken in"],
    ].map(([v, l, cls]) => `<div class="stat ${cls && v ? cls : ""}"><b>${esc(v)}</b><small>${l}</small></div>`).join("");
    document.getElementById("deals").innerHTML = DEAL_KEYS.map((k) => block(items, k, 4)).join("");
    document.getElementById("rest").innerHTML = ["draft", "listed", "accepted", "pickup", "sold"].map((k) => block(items, k, 3)).join("");
    document.getElementById("todon").textContent = reminders.length;
    document.getElementById("todo").innerHTML = reminders.slice(0, 9).map((r) =>
      `<div class="todo" style="--c:${(BUYER[r.stage] || STAGE.listed).c}"><b>${esc(r.text)}</b><small>${[r.buyer ? first(r.buyer) : "", esc(r.item)].filter(Boolean).join(" · ")}</small></div>`).join("")
      + (reminders.length > 9 ? `<div class="more">and ${reminders.length - 9} more</div>` : "") || `<div class="clear">Nothing waiting on you.</div>`;
  } catch { /* server not reachable; keep the last picture and try again */ }
}
function tick() {
  const d = new Date();
  document.getElementById("time").textContent = d.toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" });
  document.getElementById("date").textContent = d.toLocaleDateString(LOCALE, { weekday: "long", month: "long", day: "numeric" });
}
draw(); tick();
setInterval(draw, 10000);
setInterval(tick, 5000);
document.addEventListener("dblclick", () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()));
</script>
</body>
</html>
