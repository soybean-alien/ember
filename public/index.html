<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember</title>
<style>
  /* Ember by soybean_alien. Navy and orange, dark only. Stage colours come from shared.js as --c. */
  :root { color-scheme: dark; --bg:#071023; --panel:#0c1a36; --raise:#12244a; --line:#1e3260; --ink:#eaf0ff; --mute:#8d9dc2; --accent:#ff7a1a; --warn:#ffd23f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 "Segoe UI", system-ui, sans-serif; }
  input, textarea, select, button { font:inherit; color:inherit; }
  input, textarea, select { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; width:100%; }
  textarea { resize:vertical; min-height:150px; line-height:1.5; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { background:var(--raise); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1a0d00; font-weight:600; }
  button.link { background:none; border:none; padding:2px 4px; color:var(--mute); }
  button.link:hover { color:var(--accent); }
  a { color:var(--accent); }

  .app { display:grid; grid-template-columns:230px minmax(0, 1fr); min-height:100vh; }
  .side { background:var(--panel); border-right:1px solid var(--line); padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .logo { padding:0 8px 16px; display:flex; align-items:center; gap:10px; }
  .logo b { font-size:20px; letter-spacing:.2px; }
  .logo small { display:block; color:var(--mute); font-size:12px; }
  .nav, .filt { display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none; border-radius:6px; padding:6px 8px; }
  .nav:hover, .filt:hover, .nav.on, .filt.on { background:var(--raise); }
  .nav.on, .filt.on { font-weight:600; }
  .sidehead { margin:18px 8px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); }
  .filt .n { margin-left:auto; color:var(--mute); font-size:12px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--c, var(--mute)); flex:none; }
  .ember { display:inline-block; width:10px; height:10px; border-radius:50%; flex:none; vertical-align:middle;
    background:color-mix(in srgb, #ff7a1a calc(var(--h) * 100%), #1e3260); box-shadow:0 0 calc(var(--h) * 12px) rgba(255,122,26,var(--h)); }
  .logo .ember { width:14px; height:14px; }

  header { display:flex; align-items:center; gap:12px; padding:10px 22px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header #search { width:260px; }
  form.quick { display:flex; gap:8px; margin-left:auto; }

  .moves { padding:14px 22px 0; display:flex; gap:10px; flex-wrap:wrap; align-items:stretch; }
  .moves h2 { margin:0; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); writing-mode:vertical-rl; transform:rotate(180deg); text-align:center; }
  .move { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; padding:8px 12px; cursor:pointer; max-width:290px; }
  .move:hover { border-color:var(--accent); border-left-color:var(--c); }
  .move b { display:block; }
  .move small { color:var(--mute); }

  .stats { display:flex; gap:12px; padding:14px 22px 10px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; min-width:128px; }
  .stat b { display:block; font:600 20px/1.2 "Segoe UI", system-ui, sans-serif; }
  .stat.hot b { color:var(--accent); }
  .stat small { color:var(--mute); }

  .board { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(215px, 1fr); gap:12px; padding:6px 22px 30px; overflow-x:auto; }
  .board.queue { display:block; }
  .col h2 { margin:0 0 8px; padding:6px 10px; font-size:12px; letter-spacing:.03em; display:flex; justify-content:space-between; border-radius:6px;
    color:var(--c); background:color-mix(in srgb, var(--c) 16%, transparent); border-left:4px solid var(--c); }
  .card { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer; display:grid; grid-template-columns:44px 1fr; gap:10px; }
  .card:hover, .card.on { border-color:var(--accent); border-left-color:var(--c); }
  .thumb { width:44px; height:44px; border-radius:6px; background:var(--raise) center/cover; }
  .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .meta { color:var(--mute); font-size:12px; margin-top:3px; }
  .chip { display:inline-block; background:var(--raise); border-radius:10px; padding:1px 8px; font-size:11px; margin:3px 4px 0 0; }
  .flag { color:var(--warn); font-size:12px; }
  .empty { color:var(--mute); font-size:12px; border:1px dashed var(--line); border-radius:8px; padding:14px 10px; text-align:center; }
  .mini { padding:2px 8px; font-size:12px; margin:4px 4px 0 0; }
  .mini.go { border-color:#b6f23c; color:#b6f23c; }

  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); padding:9px 12px; border-bottom:1px solid var(--line); }
  td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr { cursor:pointer; box-shadow:inset 4px 0 0 var(--c); }
  tbody tr:hover, tbody tr.on { background:var(--raise); }
  tbody tr:last-child td { border-bottom:none; }
  td.id { color:var(--mute); font:12px "Cascadia Mono", Consolas, monospace; white-space:nowrap; }
  td .thumb { width:32px; height:32px; display:inline-block; vertical-align:middle; margin-right:10px; }
  td .mini { margin-top:0; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; white-space:nowrap;
    color:var(--c); background:color-mix(in srgb, var(--c) 16%, transparent); }

  aside { position:fixed; top:0; right:0; bottom:0; width:min(580px, 100vw); background:var(--panel); border-left:1px solid var(--line); box-shadow:-12px 0 30px rgba(0,0,0,.4); overflow-y:auto; padding:18px 20px 40px; display:none; }
  aside.open { display:block; }
  aside h3 { margin:22px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); display:flex; justify-content:space-between; align-items:center; }
  .row { display:grid; gap:8px; margin-bottom:8px; align-items:center; }
  .r2 { grid-template-columns:1fr 1fr; } .r3 { grid-template-columns:2fr 1fr 1fr; }
  label { display:block; font-size:12px; color:var(--mute); margin-bottom:3px; }
  .sub { background:var(--bg); border:1px solid var(--line); border-left:4px solid var(--c, var(--line)); border-radius:8px; padding:10px; margin-bottom:8px; }
  .sub input, .sub select { background:var(--panel); }
  .steps { display:flex; flex-wrap:wrap; gap:5px; margin:2px 0 8px; }
  .step { padding:2px 9px; border-radius:12px; font-size:12px; background:none; border:1px solid color-mix(in srgb, var(--c) 45%, transparent); color:var(--c); }
  .step.on { background:var(--c); color:#071023; font-weight:600; border-color:var(--c); }
  .next { font-size:12px; margin-bottom:8px; } .next b { color:var(--accent); }
  .photos { display:flex; gap:8px; flex-wrap:wrap; }
  .photos .ph { width:76px; height:76px; border-radius:6px; background:var(--raise) center/cover; position:relative; }
  .photos .ph button { position:absolute; top:2px; right:2px; padding:0 6px; border-radius:10px; }
  .photos .add { display:grid; place-items:center; border:1px dashed var(--line); color:var(--mute); cursor:pointer; font-size:12px; text-align:center; margin:0; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .soldbox { display:flex; gap:8px; align-items:center; }
  .soldbox input { width:110px; }
  .mkt { margin-top:6px; } .mkt a { margin-right:12px; } .mkt .stale { color:var(--accent); }
  details summary { cursor:pointer; color:var(--mute); margin:8px 0; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--accent); color:#1a0d00; font-weight:600; padding:8px 16px; border-radius:20px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  #toast.bad { background:#ff5d73; color:#fff; }
  .remacts { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .remacts select.mini { width:auto; padding:2px 6px; font-size:12px; }

  /* Tutorial: a card that follows a practice sale, and a pulsing ring on the control to use next. */
  #tour { position:fixed; left:246px; bottom:18px; width:min(400px, calc(100vw - 32px)); z-index:50; background:var(--raise); border:1px solid var(--accent); border-radius:12px; padding:14px 16px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  #tour[hidden] { display:none; }
  #tour .n { color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  #tour h4 { margin:2px 0 6px; font-size:16px; }
  #tour p { margin:0 0 10px; color:var(--ink); }
  #tour .bar { height:3px; background:var(--line); border-radius:2px; margin-bottom:10px; }
  #tour .bar i { display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .3s; }
  #tour .btns { display:flex; gap:8px; align-items:center; }
  #tour .btns .link { margin-left:auto; }
  .tour-hi { outline:2px solid var(--accent) !important; outline-offset:3px; border-radius:6px; animation:tourpulse 1.4s ease-in-out infinite; }
  @keyframes tourpulse { 50% { outline-color:transparent; } }
  @media (prefers-reduced-motion: reduce) { .tour-hi { animation:none; } }
  @media (max-width:700px) { #tour { left:16px; } }
</style>
</head>
<body>
<div class="app">
<nav class="side">
  <div class="logo"><span class="ember" style="--h:1"></span><div><b>Ember</b><small>Sales desk</small></div></div>
  <button class="nav" data-view="queue">Queue</button>
  <button class="nav" data-view="board">Board</button>
  <button class="nav" id="navwall" onclick="window.open('/wall.html', 'ember-wall')">Wall view</button>
  <button class="nav" onclick="tourStart()">Tutorial</button>
  <div class="sidehead">Where each deal is</div>
  <div id="filters"></div>
  <div class="sidehead">Pickup details</div>
  <div style="padding:0 8px">
    <label>Payment</label><input data-set="payment">
    <label style="margin-top:6px">Meet-up spot</label><input data-set="spot" placeholder="e.g. Kroger parking lot">
    <label style="margin-top:6px">Town and postcode or zip</label><input data-set="area" placeholder="e.g. Springfield, IL 62701">
    <label style="margin-top:6px">Local pickup discount, % off the going rate</label><input data-set="local_off" type="number" min="0" max="90" step="1">
    <label style="margin-top:6px">Remind me before a pickup, minutes</label><input data-set="remind_mins" type="number" min="0" max="1440" step="5">
  </div>
  <div class="sidehead">Region</div>
  <div style="padding:0 8px">
    <label>Country (dates, eBay site)</label><select data-set="region"><option value="US">United States</option><option value="UK">United Kingdom</option><option value="IE">Ireland</option><option value="DE">Germany</option></select>
    <label style="margin-top:6px">Currency for new items</label><select data-set="currency"><option>GBP</option><option>USD</option><option>EUR</option></select>
    <button style="margin-top:10px;width:100%" data-backup>Back up now</button>
    <small class="meta" id="ver"></small>
  </div>
</nav>
<div>
<header>
  <input id="search" type="search" placeholder="Search items, buyers, handles">
  <form class="quick" id="quick">
    <input id="qname" placeholder="New item: brand, model, size" style="width:280px" required>
    <input id="qprice" placeholder="Asking" type="number" min="0" step="any" style="width:110px">
    <button class="primary">Add item</button>
  </form>
</header>
<div class="moves" id="moves"></div>
<div class="stats" id="stats"></div>
<main class="board" id="board"></main>
</div>
</div>
<aside id="drawer"></aside>
<div id="tour" hidden></div>
<div id="toast"></div>
<datalist id="platforms"><option>Facebook Marketplace<option>eBay<option>Craigslist<option>OfferUp<option>Nextdoor<option>Mercari</datalist>

<script src="/shared.js"></script>
<script>
const LEADS = ["", "Decided buyer", "Enthusiast", "Gift buyer", "Newcomer"];
const $ = (s, r = document) => r.querySelector(s);
const opts = (list, cur) => list.map((o) => `<option${o === cur ? " selected" : ""}>${esc(o)}</option>`).join("");
const col = (key) => `--c:${(STAGE[key] || STAGE.draft).c}`;
const thumb = (i) => `<span class="thumb" style="${i.photos[0] ? `background-image:url('/photos/${encodeURIComponent(i.photos[0].file)}')` : ""}"></span>`;

let state = { items: [], stats: {}, reminders: [], settings: {} };
let sel = null;
let view = localStorage.getItem("lo-view") || "queue";
let filter = "all";

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
// A save that fails says so instead of failing silently.
window.addEventListener("unhandledrejection", (e) => toast(`Not saved: ${e.reason?.message || e.reason}`, true));
function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.classList.toggle("bad", !!bad); t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), bad ? 5000 : 1800); }
async function copy(text, msg = "Copied") { await navigator.clipboard.writeText(text); toast(msg); }

async function load() {
  state = await api("GET", "/api/board");
  useSettings(state.settings);
  $("#qprice").placeholder = `Asking ${symbol()}`;
  $("#ver").textContent = `Ember ${state.version}`;
  document.querySelectorAll("[data-set]").forEach((el) => { if (document.activeElement !== el) el.value = state.settings[el.dataset.set] || ""; });
  renderBoard();
}

// The two one-click moves on every live deal: someone new wrote in, or the buyer said yes.
function quick(i) {
  if (i.stage === "sold" || i.stage === "draft") return "";
  const lead = leadOf(i);
  return `<button class="mini" data-quick="${i.id}">+ Someone messaged</button>${lead && !CLOSING.includes(lead.stage) ? `<button class="mini go" data-accept="${lead.id}" data-item="${i.id}">Accepted</button>` : ""}`;
}
function buyerLine(i) {
  const lead = leadOf(i);
  if (!lead || i.stage === "sold") return "";
  const others = i.buyers.filter((b) => b.stage !== "dropped").length - 1;
  return `${ember(lead.updated)} ${esc(lead.name || "Buyer")}${lead.pickup_at ? `, ${esc(whenOf(lead.pickup_at))}` : lead.meet ? `, ${esc(lead.meet)}` : ""} <span class="meta">${esc(ago(lead.updated))}${others > 0 ? ` · +${others}` : ""}</span>`;
}

// Every redraw re-checks the tutorial once the screen has settled (the drawer is often redrawn right after the board).
function tourSoon() { clearTimeout(tourSoon.t); tourSoon.t = setTimeout(tourCheck, 0); }

function renderBoard() {
  tourSoon();
  const s = state.stats;
  // Each reminder can be marked done, snoozed or dismissed without touching the buyer's status.
  const rem = (r, k) => `data-rem="${k}" data-ref="${esc(r.ref)}" data-key="${esc(r.key)}"`;
  $("#moves").innerHTML = state.reminders.length || state.snoozed ? `<h2>Your move${state.snoozed ? ` <small class="meta">${state.snoozed} snoozed</small>` : ""}</h2>` + state.reminders.map((r) =>
    `<div class="move" data-open="${r.item_id}" style="--c:${(BUYER[r.stage] || STAGE.listed).c}">
      <b>${esc(r.text)}</b><small>${esc([r.buyer, r.item].filter(Boolean).join(" · "))}${r.due && r.kind !== "posting" ? ` · due ${esc(ago(r.due))}` : ""}</small>
      <span class="remacts">${r.kind === "posting"
        ? `${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Open listing</a>` : ""}<button class="mini go" data-takedown="${r.posting_id}">I took it down</button>`
        : `<button class="mini go" ${rem(r, "done")}>Done</button>`}
        <select class="mini" ${rem(r, "snoozed")}><option value="">Snooze…</option><option value="60">1 hour</option><option value="180">3 hours</option><option value="tonight">Tonight 19:00</option><option value="tomorrow">Tomorrow 09:00</option></select>
        <button class="mini" ${rem(r, "dismissed")} title="Hide this reminder">Dismiss</button></span></div>`).join("") : "";
  $("#stats").innerHTML = [
    [state.reminders.length, "waiting on you", "hot"],
    [s.listed, "listed now"],
    [totals(s.listed_value), "asking, in total"],
    [s.in_talks, "with a buyer talking"],
    [s.sold, "sold"],
    [totals(s.sold_value), "taken in"],
    [s.sold ? `${s.at_asking} of ${s.sold}` : "0", "sold at asking price"],
    [s.avg_days ?? "0", "days to sell, on average"],
  ].map(([v, l, cls]) => `<div class="stat ${cls && v ? cls : ""}"><b>${esc(v)}</b><small>${l}</small></div>`).join("");

  document.querySelectorAll(".nav[data-view]").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
  $("#filters").innerHTML = [{ key: "all", label: "All", c: "#8d9dc2" }, ...STAGES].map((st) => {
    const n = st.key === "all" ? state.items.length : state.items.filter((i) => i.stage === st.key).length;
    return `<button class="filt${filter === st.key ? " on" : ""}" data-filter="${st.key}" style="--c:${st.c}"><span class="dot"></span>${st.label}<span class="n">${n}</span></button>`;
  }).join("");

  const q = $("#search").value.trim().toLowerCase();
  const shown = state.items.filter((i) =>
    (filter === "all" || i.stage === filter) &&
    (!q || [i.name, i.title, ticket(i.id), ...i.buyers.flatMap((b) => [b.name, b.handle]), ...i.postings.map((p) => p.platform)].some((t) => String(t || "").toLowerCase().includes(q))));
  const board = $("#board");
  board.classList.toggle("queue", view === "queue");

  if (view === "board") {
    board.innerHTML = STAGES.filter((st) => filter === "all" || st.key === filter).map((st) => {
      const items = shown.filter((i) => i.stage === st.key);
      return `<section class="col" style="--c:${st.c}"><h2><span>${st.label}</span><span>${items.length}</span></h2>${items.map(card).join("") || `<div class="empty">Nothing here</div>`}</section>`;
    }).join("");
    return;
  }
  // Queue: what needs you first. Deals closing, then the ones waiting on your reply, then the ones waiting on them, listings, drafts, sold.
  const order = { accepted: 0, pickup: 1, contacted: 2, asked: 2, countered: 2, thinking: 3, silent: 3, listed: 4, draft: 5, sold: 6 };
  const rows = [...shown].sort((a, b) => order[a.stage] - order[b.stage] || Number(b.quiet) - Number(a.quiet) || b.id - a.id);
  board.innerHTML = rows.length ? `<table><thead><tr><th>Ticket</th><th>Item</th><th>Where it's at</th><th>Listed on</th><th>Buyer, last move</th><th>Age</th><th>Price</th><th></th></tr></thead><tbody>${rows.map(row).join("")}</tbody></table>`
    : `<div class="empty">No items match. Add one with the box at the top.</div>`;
}

function row(i) {
  const platforms = [...new Set(i.postings.map((p) => p.platform).filter(Boolean))];
  return `<tr class="${sel === i.id ? "on" : ""}" data-open="${i.id}" style="${col(i.stage)}">
    <td class="id">${ticket(i.id)}</td>
    <td>${thumb(i)}<b>${esc(i.name || "Unnamed item")}</b></td>
    <td><span class="pill"><span class="dot"></span>${STAGE[i.stage].label}</span>${i.quiet ? ` <span class="flag">no messages</span>` : ""}</td>
    <td>${platforms.map((p) => `<span class="chip">${esc(p)}</span>`).join("")}</td>
    <td>${buyerLine(i)}</td>
    <td>${i.days_listed === null ? "" : days(i.days_listed)}</td>
    <td><b>${i.stage === "sold" ? money(i.sold_price, 2, i.currency) : money(i.asking, 2, i.currency)}</b></td>
    <td>${quick(i)}</td>
  </tr>`;
}

function card(i) {
  const live = i.postings.filter((p) => p.platform && (p.status === "live" || i.stage === "sold"));
  const price = i.stage === "sold" ? `${money(i.sold_price, 2, i.currency)} sold` : money(i.asking, 2, i.currency);
  const age = i.days_listed === null ? "" : i.stage === "sold" ? `sold in ${days(i.days_listed)}` : `${days(i.days_listed)} listed`;
  return `<div class="card${sel === i.id ? " on" : ""}" data-open="${i.id}">
    ${thumb(i)}
    <div>
      <div class="nm">${esc(i.name || "Unnamed item")}</div>
      <div class="meta">${[price, age].filter(Boolean).map(esc).join(" · ")}</div>
      <div>${live.map((p) => `<span class="chip">${esc(p.platform)}</span>`).join("")}</div>
      <div style="margin-top:4px">${buyerLine(i)}</div>
      ${i.quiet ? `<div class="flag">${days(i.days_listed)}, no messages. Try the second version.</div>` : ""}
      ${quick(i)}
    </div></div>`;
}

const field = (kind, id, f, val, extra = "") => `data-kind="${kind}" data-id="${id}" data-f="${f}" value="${esc(val)}" ${extra}`;

function buyerBox(i, b) {
  const m = b.move;
  const next = !m ? "" : m.who === "you" || m.is_due
    ? `<div class="next"><b>Your move:</b> ${esc(m.text)}</div>`

// The going rate: what the same item actually sold for, typed in from eBay's sold listings. The suggestion is the typical
// sold price less the seller's own local-pickup discount, rounded to a price people actually use.
function suggest(i) {
  const mid = Number(i.mkt_mid);
  if (!mid) return 0;
  const p = mid * (1 - (Number(state.settings.local_off) || 0) / 100);
  return p >= 20 ? Math.round(p / 5) * 5 : Math.round(p);
}
function mktLine(i) {
  const mid = Number(i.mkt_mid), sug = suggest(i), off = Number(state.settings.local_off) || 0;
  if (!mid) return "Open eBay sold prices, look at the last five or so that match your item's condition (and size, for clothes and bags), and type what you see.";
  const age = i.mkt_checked ? Math.floor((Date.now() - new Date(i.mkt_checked)) / 864e5) : null;
  const pct = Number(i.asking) ? ` Your asking price is ${Math.round((Number(i.asking) / mid) * 100)}% of the typical sold price.` : "";
  const c = i.currency;
  return `Suggested asking price: <b>${money(sug, 2, c)}</b>${off ? ` (typical ${money(mid, 2, c)}, less ${off}% for local pickup)` : ""}.${pct}
    ${Number(i.asking) !== sug && !i.sold_at ? `<button class="link" data-act="usemkt">Use ${money(sug, 2, c)}</button>` : ""}
    ${age === null ? "" : age > 30 ? `<span class="stale">Checked ${age} days ago; check again.</span>` : `Checked ${dateOf(i.mkt_checked)}.`}`;
}

// Set a buyer's status. "Accepted" also puts the wrap-up message on the clipboard; "Paid and picked up" also marks the item sold.
// Both ask for the price first: "Accepted" records the agreed price, and "Paid and picked up" lets it be corrected before the sale is recorded.
function askPrice(question, start) {
  for (;;) {
    const v = prompt(question, start ?? "");
    if (v === null) return undefined; // cancelled
    if (v.trim() === "" || (Number.isFinite(Number(v)) && Number(v) >= 0)) return v.trim();
    alert("Type a price of 0 or more, or leave it blank if you don't know it.");
  }
}
async function setStage(buyerId, stage) {
  const i0 = state.items.find((x) => x.buyers.some((b) => b.id === buyerId));
  const b0 = i0.buyers.find((x) => x.id === buyerId);
  const body = { stage };
  if (stage === "accepted") {
    const v = askPrice(`What price did ${b0.name || "they"} agree to?`, b0.agreed_price ?? b0.offer ?? i0.asking);
    if (v === undefined) return;
    body.agreed_price = v;
  }
  if (stage === "bought" && !i0.sold_at) {
    const v = askPrice("Sold for (what they paid):", dealPrice(i0, b0));
    if (v === undefined) return;
    body.sold_price = v;
  }
  await api("PUT", `/api/buyers/${buyerId}`, body);
  await load();
  const i = state.items.find((x) => x.buyers.some((b) => b.id === buyerId));
  const b = i.buyers.find((x) => x.id === buyerId);
  if (stage === "bought" && !i0.sold_at) toast(`Sold for ${money(i.sold_price, 2, i.currency) || "an unknown price"}. Take the listings down: they're in Your move.`);
  if (stage === "accepted") await copy(wrapUp(i, b, state.settings), "Wrap-up message copied. Paste it to the buyer.").catch(() => {});
  sel = i.id; renderBoard(); renderDrawer();
}

// Snooze times: in an hour or three, tonight at 19:00, or tomorrow at 09:00.
function snoozeUntil(v) {
  const d = new Date();
  if (v === "tonight") { if (d.getHours() >= 19) d.setDate(d.getDate() + 1); d.setHours(19, 0, 0, 0); return d; }
  if (v === "tomorrow") { d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return d; }
  return new Date(Date.now() + Number(v) * 6e4);
}

// Photos are shrunk in the browser before upload so the database folder stays small.
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
async function addPhotos(files) {
  const imgs = files.filter((f) => f.type.startsWith("image/"));
  if (!imgs.length || !sel) return;
  await api("POST", `/api/items/${sel}/photos`, { photos: await Promise.all(imgs.map(shrink)) });
  await refresh(true);
}

  { t: "Two days later", d: "In two days, <b>Your move</b> will remind you to thank the buyer. This button copies a message that asks for feedback once, with no pressure, and closes the ticket.",
    el: () => inDrawer('[data-act="thanks"]') },
  { t: "The TV wall", d: "<b>Wall view</b> opens the read-only screen for your TV. It shows every deal by colour and never shows emails or handles. Double-click it for full screen.",
    el: () => $("#navwall") },
  { t: "That's the whole loop", d: "Add, list, track each move, close, follow up. You can run this tutorial again from the left menu at any time." },
];
function tourSave() { tour.s ? localStorage.setItem("ember-tour", JSON.stringify(tour.s)) : localStorage.removeItem("ember-tour"); }
function tourStart() { tour.s = { step: 0, max: Math.max(0, ...state.items.map((i) => i.id)), item: null }; tour.shown = -1; localStorage.setItem("ember-tour-seen", "1"); tourCheck(); }
function tourEnd() { tour.s = null; tourCheck(); }
function tourCheck() {
  const box = $("#tour");
  document.querySelectorAll(".tour-hi").forEach((e) => e.classList.remove("tour-hi"));
  if (tour.s && tour.s.step > 0 && !tItem()) { tour.s = null; toast("Tutorial ended: the practice ticket is gone."); }
  tourSave();
  if (!tour.s) { box.hidden = true; return; }
  while (tour.s.step < TOUR.length - 1 && TOUR[tour.s.step].ok?.()) tour.s.step++;
  tourSave();
  const k = tour.s.step, st = TOUR[k], last = k === TOUR.length - 1;
  let target = st.el?.();
  let hint = "";
  if (st.el && !target && tItem()) { target = $(`#board [data-open="${tour.s.item}"]`); hint = " <i>Click your practice ticket to open it first.</i>"; }
  target?.classList.add("tour-hi");
  if (tour.shown !== k) { tour.shown = k; target?.scrollIntoView({ block: "center", behavior: "smooth" }); }
  box.hidden = false;
  box.innerHTML = `<div class="bar"><i style="width:${Math.round((k / (TOUR.length - 1)) * 100)}%"></i></div>
    <div class="n">Step ${k + 1} of ${TOUR.length}${st.ok ? " · waiting for you" : ""}</div><h4>${st.t}</h4><p>${st.d}${hint}</p>
    <div class="btns">${last
      ? `${tItem() ? `<button class="primary" data-tour="delete">Delete the practice ticket</button><button data-tour="end">Keep it</button>` : `<button class="primary" data-tour="end">Finish</button>`}`
      : `${k ? `<button class="${st.ok ? "" : "primary"}" data-tour="next">${st.ok ? "Skip this step" : "Next"}</button>` : ""}<button class="link" data-tour="end">End tutorial</button>`}</div>`;
}
$("#tour").addEventListener("click", async (e) => {
  const a = e.target.closest("[data-tour]")?.dataset.tour;
  if (a === "next") { tour.s.step = Math.min(TOUR.length - 1, tour.s.step + 1); tourCheck(); }
  if (a === "end") tourEnd();
  if (a === "delete") { const id = tour.s.item; tour.s = null; await api("DELETE", `/api/items/${id}`); if (sel === id) sel = null; await refresh(true); }
});

load().then(() => { if (!tour.s && !state.items.length && !localStorage.getItem("ember-tour-seen")) tourStart(); }).catch((e) => toast(e.message));
// Keeps the embers and reminders current while the desk sits open, and redraws an open ticket when it was changed somewhere
// else (another window, or Claude filling it in), so an old copy of the text can't be saved back over the new one.
// A box being typed in is never redrawn under the cursor; it catches up on the next pass after the cursor leaves.
setInterval(async () => {
  await load().catch(() => {});
  const i = state.items.find((x) => x.id === sel);
  const typing = $("#drawer").contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (i && !typing && drawerSnap !== JSON.stringify(i)) renderDrawer();
}, 10000);
</script>
